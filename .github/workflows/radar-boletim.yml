name: Boletim Licitacoes

on:
  schedule:
    # Varias janelas p/ pegar o PNCP quando ele esta saudavel (a consulta gratuita
    # vive sobrecarregada e so responde em algumas janelas). Site atualiza em toda
    # coleta; o E-MAIL sai so 1x/dia (08:15 BRT, a janela que o ecossistema usa).
    - cron: '0 7 * * *'    # 04:00 BRT (UTC-3) -- madrugada, PNCP mais leve
    - cron: '15 11 * * *'  # 08:15 BRT -- espelha o horario do Apps Script (envia e-mail)
    - cron: '0 13 * * *'   # 10:00 BRT
    - cron: '0 16 * * *'   # 13:00 BRT
    - cron: '0 18 * * *'   # 15:00 BRT
    - cron: '0 20 * * *'   # 17:00 BRT
    - cron: '0 23 * * *'   # 20:00 BRT
  workflow_dispatch:         # botao "Run workflow" manual no GitHub

# Serializa os runs deste workflow (crons + dispatch): sem isto, dois runs empurram docs/ ao mesmo
# tempo e um leva 'failed to push some refs' (causa do run 28941360480 falhar e o boletim nao publicar).
concurrency:
  group: boletim-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  boletim:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Gravar credenciais Google
        run: |
          mkdir -p credenciais
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credenciais/service_account.json

      - name: Sincronizar filiais (planilha de alvaras -> aba Filiais)
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credenciais/service_account.json
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
        run: python sync_filiais.py || echo "sync filiais falhou -- radar segue com a base atual"

      - name: Rodar radar.py
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credenciais/service_account.json
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          HAVERSINE_AJUSTE_FATOR: '1.0'
        run: python radar.py

      - name: Enviar boletim por e-mail
        # E-mail so 1x/dia: na coleta das 08:15 BRT (cron 15 11) ou no disparo manual.
        # As outras coletas so atualizam o site (evita spam de varios e-mails/dia).
        if: github.event.schedule == '15 11 * * *' || github.event_name == 'workflow_dispatch'
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credenciais/service_account.json
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}
          SITE_URL: https://concrelagos-licitacao.github.io/radar-boletim
        # `|| echo` (como o sync_filiais): uma falha no envio NUNCA derruba o job -> o site
        # ainda e gerado/commitado. E-mail e so aviso; o site e a fonte de verdade.
        run: python boletim_email.py || echo "e-mail falhou (segue o site)"

      - name: Gerar site (GitHub Pages)
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credenciais/service_account.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORS_API_KEY: ${{ secrets.ORS_API_KEY }}   # OpenRouteService (rota real na exibicao; sem key = linha reta)
          MOSTRAR_FILIAIS: '1'   # mapa mostra usinas/pedreiras (usuario pediu; site tem noindex)
        run: python gerar_site.py

      # watchlist priorizada + captura medida vs ConLic (consumidos pelo painel "Radar em numeros").
      # `|| echo`: se falharem, o site usa os JSON commitados anteriores -- nao bloqueia.
      - name: Gerar alvos + vazamento
        if: success()
        env:
          GOOGLE_SHEETS_CREDENTIALS_PATH: ./credenciais/service_account.json
        run: |
          python alvos.py || echo "alvos falhou (usa o anterior)"
          python vazamento.py || echo "vazamento falhou (usa o anterior)"

      - name: Limpar credenciais
        if: always()
        run: rm -f credenciais/service_account.json

      # Guardrail: se a geracao produziu site/JSON quebrado, ABORTA antes do commit (sem `|| echo`:
      # este PRECISA derrubar o job pra nao publicar site quebrado que a diretoria abriria).
      - name: Smoke-test do site (bloqueia commit se quebrou)
        if: success()
        run: python smoke_test.py

      # Anti-corrida no push (causa do run 28941360480 falhar): se o remoto avancou desde o checkout
      # (push manual de codigo), rebaseia por baixo das mudancas de docs/ antes do commit final.
      - name: Sincronizar com o remoto antes do commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }} || echo "sem rebase necessario"

      - name: Commit do site
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(site): atualiza boletins [skip ci]"
          file_pattern: 'docs/ cache_rotas.json radar_estado.json municipios_br.csv'
